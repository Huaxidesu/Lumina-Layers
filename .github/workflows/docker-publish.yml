name: Full Auto Sync and Build

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and Merge from Upstream
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"

          touch .gitattributes
          if ! grep -q '^\.github/\*\* merge=ours$' .gitattributes; then
            printf '%s\n' '.github/** merge=ours' >> .gitattributes
          fi
          if ! grep -q '^Dockerfile merge=ours$' .gitattributes; then
            printf '%s\n' 'Dockerfile merge=ours' >> .gitattributes
          fi
          if ! grep -q '^docker-compose\.yml merge=ours$' .gitattributes; then
            printf '%s\n' 'docker-compose.yml merge=ours' >> .gitattributes
          fi

          git config merge.ours.driver true

          if ! git diff --quiet -- .gitattributes; then
            git add .gitattributes
            git commit -m "chore: protect .github and docker files on upstream sync" || true
            git push origin "HEAD:${BRANCH}" || true
          fi

          keep_dir="$(mktemp -d)"
          mkdir -p .github
          tar -czf "${keep_dir}/github.tgz" .github || true

          git remote add upstream https://github.com/MOVIBALE/Lumina-Layers.git 2>/dev/null || true
          git fetch --prune upstream

          UPSTREAM_BRANCH="$(git remote show upstream | sed -n 's/.*HEAD branch: //p' | head -n 1)"
          UPSTREAM_BRANCH="${UPSTREAM_BRANCH:-main}"
          echo "Upstream default branch: ${UPSTREAM_BRANCH}"

          before="$(git rev-parse HEAD)"

          git merge --no-edit "upstream/${UPSTREAM_BRANCH}" || {
            git checkout --ours -- .github || true
            rm -rf .github || true
            if [ -f "${keep_dir}/github.tgz" ]; then
              tar -xzf "${keep_dir}/github.tgz" || true
            fi
            git add .github .gitattributes || true
            git commit -m "chore: resolve .github conflicts by keeping local" || true
          }

          after="$(git rev-parse HEAD)"

          has_updated="false"
          if [ "$before" != "$after" ]; then
            has_updated="true"
            git push origin "HEAD:${BRANCH}"
          fi

          should_build="false"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "$has_updated" = "true" ]; then
            should_build="true"
          fi

          echo "has_updated=${has_updated}" >> "$GITHUB_OUTPUT"
          echo "should_build=${should_build}" >> "$GITHUB_OUTPUT"
          echo "image_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.sync.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log into GHCR
        if: steps.sync.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        if: steps.sync.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/huaxidesu/lumina-layers:latest
            ghcr.io/huaxidesu/lumina-layers:sha-${{ steps.sync.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Release
        if: steps.sync.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Auto Build ${{ github.run_number }}
          body: |
            自动同步并构建完成。
            同步源: https://github.com/MOVIBALE/Lumina-Layers
            镜像地址:
            - `docker pull ghcr.io/huaxidesu/lumina-layers:latest`
            - `docker pull ghcr.io/huaxidesu/lumina-layers:sha-${{ steps.sync.outputs.image_sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
